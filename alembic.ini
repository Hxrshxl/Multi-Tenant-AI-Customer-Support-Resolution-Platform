# Alembic configuration.
#
# The database URL is deliberately absent: env.py reads it from the
# application settings, so there is exactly one place that knows the DSN and
# no chance of a migration running against a different database than the app.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Timestamped, readable revision filenames instead of a bare hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
